# sara カスタムモデルスキーマ（layat）。sara の組み込みモデルを全面的に置き換える。
# 型構成・ID 形式・フィールドと関係の読み方は docs/model.md を参照。
# id_format は ADR だけ連番、他は UUIDv4。採番は sara-new / `sara init adr` が行う。

item_types:
  # ---- 仕様の系統（solution → use_case → requirement → design）----

  # 根。layat というプロダクトが何であるかの 1 件。docs/solution/。
  - id: solution
    display_name: Solution
    prefix: SOL
    id_format: '{prefix}-{uuid4}'
    parent_types: []
    fields: []
    allowed_targets: []

  # ユーザーがどう使うか。docs/use-cases/。
  - id: use_case
    display_name: Use Case
    prefix: UC
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - solution
    fields: []
    allowed_targets:
      - relation: refines
        targets:
          - solution

  # 何を満たすべきか。docs/requirements/。
  - id: requirement
    display_name: Requirement
    prefix: REQ
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - use_case
    fields:
      # 英語の規範文。sara が RFC2119 キーワードの存在を検証する。
      # SHALL 系だけを使う規約は docs/agents/sara-graph.md が持つ。
      - name: specification
        display_name: Specification
        field_type: text
        required: true
        placeholder: The system SHALL <describe the requirement>.
      # specification と対になる日本語の規範文。sara は検査しない。
      # 規範助動詞で終える規約と強度の写像は docs/agents/sara-graph.md が持つ。
      - name: specification_ja
        display_name: Specification (ja)
        field_type: text
        required: true
        placeholder: layat は <要求> を満たさなければならない。
    allowed_targets:
      - relation: derives_from
        targets:
          - use_case
      - relation: depends_on
        targets:
          - requirement

  # どう実現するか。docs/design/。
  - id: design
    display_name: Design
    prefix: DSG
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - requirement
      - test_plan
    fields: []
    allowed_targets:
      # テストハーネスの実装形を表す design は test_plan を満たす。
      - relation: satisfies
        targets:
          - requirement
          - test_plan
      - relation: depends_on
        targets:
          - design

  # ---- 品質とテスト計画の系統（solution 直下）----

  # 品質方針・規約・プロセス横断のガバナンス文書。docs/quality/。
  # テストプロセスの外にある関心事を置き、テスト計画は test_plan に置く。
  - id: quality
    display_name: Quality
    prefix: QA
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - solution
    fields:
      # requirement の specification / specification_ja と同じ様式で書く。
      - name: specification
        display_name: Specification
        field_type: text
        required: true
        placeholder: The project SHALL <describe the quality policy>.
      - name: specification_ja
        display_name: Specification (ja)
        field_type: text
        required: true
        placeholder: layat は <品質方針> を満たさなければならない。
    allowed_targets:
      - relation: derives_from
        targets:
          - solution
      - relation: depends_on
        targets:
          - quality

  # テスト計画活動の成果物。docs/test-plan/。テストスコープ・スコープ外宣言・
  # テストレベル・テストアプローチ・テスト容易性の要求を置く。
  - id: test_plan
    display_name: Test Plan
    prefix: TP
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - solution
    fields:
      # requirement の specification / specification_ja と同じ様式で書く。
      - name: specification
        display_name: Specification
        field_type: text
        required: true
        placeholder: The test process SHALL <describe the test planning decision>.
      - name: specification_ja
        display_name: Specification (ja)
        field_type: text
        required: true
        placeholder: テストプロセスは <テスト計画上の決定> を満たさなければならない。
    allowed_targets:
      - relation: derives_from
        targets:
          - solution
      - relation: depends_on
        targets:
          - test_plan

  # ---- 技術基盤 ----

  # 開発・提供・稼働を支える技術基盤。docs/infrastructure/。
  # 開発基盤は quality を、稼働基盤は design を満たす。
  - id: infrastructure
    display_name: Infrastructure
    prefix: INF
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - quality
      - design
    fields:
      # docs/dev/definition-of-done.md の項目 ID（DOD-01 …）のリスト。
      # 実在する項目かは sara が検証しない。
      - name: dod
        display_name: Definition of Done
        field_type: !list text
        required: false
    allowed_targets:
      - relation: satisfies
        targets:
          - quality
          - design
      - relation: depends_on
        targets:
          - infrastructure

  # ---- 独立した根 ----

  # 意思決定の記録。docs/adr/。justifies で 1 本以上の item へ接続する
  # （選定基準は docs/adr/README.md の `justifies` の項）。
  - id: adr
    display_name: Architecture Decision Record
    prefix: ADR
    id_format: '{prefix}-{seq:04}'
    parent_types: []
    fields:
      # supersedes を定義していないので「廃止」は持たない。
      - name: status
        display_name: Status
        field_type: !enum
          values:
            - 提案
            - 採用
        required: true
        placeholder: 採用
      # ステータス行のカッコ書き注記。
      - name: status_note
        display_name: Status note
        field_type: text
        required: false
      # item にできない外部参照（GitHub Issue 番号・起点となったセッション等）。
      - name: issues
        display_name: Issues
        field_type: !list text
        required: false
      - name: origin
        display_name: Origin
        field_type: text
        required: false
    allowed_targets:
      - relation: justifies
        targets:
          - requirement
          - design
          - infrastructure
          - quality
          - test_plan
      # ADR ヘッダの「改訂対象:」。
      - relation: revises
        targets:
          - adr
      # ADR ヘッダの「関連:」。
      - relation: references
        targets:
          - adr

  # ---- リスクとテストの系統（risk → test_condition → test_case）----

  # 満たされない懸念。docs/risks/。requirement と design の両方を脅かせる。
  # どちらへ張るかの規約と採点規約は docs/agents/sara-graph.md。
  - id: risk
    display_name: Risk
    prefix: RISK
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - requirement
      - design
    fields:
      - name: likelihood
        display_name: Likelihood
        field_type: !enum
          values:
            - high
            - medium
            - low
        required: true
        placeholder: medium
      - name: impact
        display_name: Impact
        field_type: !enum
          values:
            - high
            - medium
            - low
        required: true
        placeholder: medium
      - name: level
        display_name: Level
        field_type: !enum
          values:
            - high
            - medium
            - low
        required: true
        placeholder: medium
    allowed_targets:
      - relation: threatens
        targets:
          - requirement
          - design

  # リスクを潰すためのテスト条件。docs/test/<対象>/。
  - id: test_condition
    display_name: Test Condition
    prefix: TC
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - risk
    fields: []
    allowed_targets:
      - relation: mitigates
        targets:
          - risk

  # 具体的なテストケース。docs/test/<対象>/。
  - id: test_case
    display_name: Test Case
    prefix: CASE
    id_format: '{prefix}-{uuid4}'
    parent_types:
      - test_condition
    fields:
      # 対応するテスト資産の正準表記（単一値）。正準形は docs/model.md を参照。
      # dev/tests/test-doc-map.sh が CASE とテスト資産の 1:1 を照合する。
      - name: target
        display_name: Target
        field_type: text
        required: true
        placeholder: internal/engine/engine_test.go
    allowed_targets:
      - relation: covers
        targets:
          - test_condition

relations:
  # ---- 組み込み由来（そのまま使う）----

  - id: refines
    display_name: Refines
    inverse: is_refined_by
    direction: upstream
    primary: true
  - id: is_refined_by
    display_name: Is refined by
    inverse: refines
    direction: downstream
    primary: false

  - id: derives_from
    display_name: Derives from
    inverse: derives
    direction: upstream
    primary: true
  - id: derives
    display_name: Derives
    inverse: derives_from
    direction: downstream
    primary: false

  - id: satisfies
    display_name: Satisfies
    inverse: is_satisfied_by
    direction: upstream
    primary: true
  - id: is_satisfied_by
    display_name: Is satisfied by
    inverse: satisfies
    direction: downstream
    primary: false

  - id: depends_on
    display_name: Depends on
    inverse: is_required_by
    direction: peer
    primary: true
  - id: is_required_by
    display_name: Is required by
    inverse: depends_on
    direction: peer
    primary: false

  - id: justifies
    display_name: Justifies
    inverse: justified_by
    direction: upstream
    primary: true
  - id: justified_by
    display_name: Justified by
    inverse: justifies
    direction: downstream
    primary: false

  # ---- 独自定義: ADR 間の peer 関係 ----
  # ADR ヘッダの「改訂対象:」に対応する節単位の部分改訂。
  # 組み込みの supersedes（ADR 全体の失効）は定義しない。
  - id: revises
    display_name: Revises
    inverse: is_revised_by
    direction: peer
    primary: true
  - id: is_revised_by
    display_name: Is revised by
    inverse: revises
    direction: peer
    primary: false

  # ADR ヘッダの「関連:」に対応。改訂を伴わない参照。
  - id: references
    display_name: References
    inverse: is_referenced_by
    direction: peer
    primary: true
  - id: is_referenced_by
    display_name: Is referenced by
    inverse: references
    direction: peer
    primary: false

  # ---- 独自定義: リスクとテストの系統 ----

  # risk → requirement / design。
  - id: threatens
    display_name: Threatens
    inverse: is_threatened_by
    direction: upstream
    primary: true
  - id: is_threatened_by
    display_name: Is threatened by
    inverse: threatens
    direction: downstream
    primary: false

  # test_condition → risk。
  - id: mitigates
    display_name: Mitigates
    inverse: is_mitigated_by
    direction: upstream
    primary: true
  - id: is_mitigated_by
    display_name: Is mitigated by
    inverse: mitigates
    direction: downstream
    primary: false

  # test_case → test_condition。
  - id: covers
    display_name: Covers
    inverse: is_covered_by
    direction: upstream
    primary: true
  - id: is_covered_by
    display_name: Is covered by
    inverse: covers
    direction: downstream
    primary: false
