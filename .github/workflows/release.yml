name: Release

on:
  push:
    branches:
      - main
    # bump PR のマージで VERSION（semver プレーンテキスト 1 行）が変わったときだけ発火する。
    paths:
      - "VERSION"
  workflow_dispatch:

# タグ作成 + Release 作成に必要な contents: write のみに絞る。
permissions:
  contents: write

# 連続 push や push × workflow_dispatch の重複でジョブが並走し、タグ作成・Release 更新が
# 競合するのを防ぐ。走行中のリリースは走り切らせる（cancel-in-progress: false）。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # リリースは main の内容だけを対象にする（workflow_dispatch はブランチを問わず起動できる）。
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # VERSION の先頭 1 行を取り前後空白を落として正規化し、semver（X.Y.Z）に合致しなければ fail させる。
      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail
          version="$(head -n1 VERSION | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION is not a valid semver (X.Y.Z): '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 成果物は添付しない。既存の Release があれば action-gh-release がそれを更新するため、
      # 同一 VERSION の再実行は本文の再生成だけで冪等になる。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      # タグ + Release が実際に作られたことを事後検証し、欠けていれば fail させる。
      - name: Verify release created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release view "$TAG" --json tagName,url --jq '.url'
