name: 'Setup Nix'
description: 'Install Nix and configure Cachix'
inputs:
  cachix-auth-token:
    description: 'Cachix authentication token'
    required: false
runs:
  using: 'composite'
  steps:
    # checks.nixos-vm の VM を nix のビルドユーザーから KVM で起動できるようにする。
    - name: Enable KVM
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install Nix
      uses: cachix/install-nix-action@v31.11.5
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          system-features = nixos-test benchmark big-parallel kvm

    - name: Setup Cachix (yasunori)
      uses: cachix/cachix-action@v17
      with:
        name: yasunori0418
        authToken: ${{ inputs.cachix-auth-token }}
