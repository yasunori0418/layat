name: ドキュメント改善
description: README.md・item・ADR と SDR・用語（ubiquitous-language/）・運用文書の誤り・不整合・分かりにくさ
labels: ["documentation", "needs-triage"]
body:
  - type: dropdown
    id: target
    attributes:
      label: 対象ドキュメント
      multiple: true
      options:
        - docs/README.md（コンセプト）
        - docs/requirements/（仕様の README と item）
        - docs/design/（設計の README と item）
        - docs/solution/・docs/use-cases/
        - docs/quality/・docs/infrastructure/
        - docs/risks/・docs/test/・docs/test-plan/
        - docs/adr/・docs/sara-adr/
        - docs/ubiquitous-language/
        - docs/agents/・docs/model.md（運用文書）
        - README.md・README.ja.md
        - その他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 問題点
      description: どこが誤っている / 不整合 / 分かりにくいか。該当箇所を引用すると早い。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 改善案
      description: どう直すべきか。用語の揺れなら docs/ubiquitous-language/index.md の一覧から用語 item を引き、正名と照らし合わせて。
    validations:
      required: false
