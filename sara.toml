# sara（ドキュメントのナレッジグラフ検証 CLI）の設定。
# 型定義は docs/model.yaml で組み込みモデルを全面置換する（→ SDR-2457aa00-fab7-4c99-af53-2e6643c21c79・epic #203）。

model_schema = "docs/model.yaml"

[repositories]
# docs/ 配下を再帰スキャンする。frontmatter の無い .md は ParseResult::Skipped で
# 静かに無視されるため、README / 概要文書 / test-plan.md 等への除外設定は不要。
paths = ["./docs"]

[validation]
# strict 有効。orphan（接続漏れ）を含む全 warning が error になり exit 1 を返す
# （epic #203 の移行完了・warning 0 到達を受けて有効化 → SDR-bf25a81b-d588-4c7e-9365-fe514ee4d626）。
# CI の sara job は required status check にはしない（検出は機械・判断は人 → SDR-6cc54665-c239-4235-92a8-f73e26c5a5ef）。
# テスト系型の着手で defect（構造的 orphan）が現れたら再検討する（→ SDR-bf25a81b-d588-4c7e-9365-fe514ee4d626）。
strict_mode = true
