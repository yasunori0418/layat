name: Test

on:
  workflow_dispatch:
  # No `paths` trigger: the workflow starts on every PR so the required status
  # checks always report. Jobs gated on `changes` skip nix work on docs-only PRs.
  pull_request:
  # Only `test-doc-matrix` consumes this trigger. Every other job carries a
  # job-level `github.event_name != 'push'` guard.
  push:
    branches:
      - main

jobs:
  changes:
    # Every consumer skips on push.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect relevant changes
        id: detect
        uses: ./.github/actions/changes

  flake-check:
    needs: changes
    # Gated at step level so the required matrix contexts `flake-check (os, system)`
    # always report on pull_request. The job-level guard only skips push.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Nix
        if: needs.changes.outputs.run == 'true'
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run nix flake check
        if: needs.changes.outputs.run == 'true'
        run: nix flake check -L

  go-coverage:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.event_name != 'push'
    # buildGoModule の checkPhase が $out へ出力する func レポートを Job Summary に表示する（閾値ゲートは持たない）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build layat (runs go test with coverage)
        run: nix build '.#layat' -L

      - name: Report coverage
        run: |
          {
            echo '## Go test coverage'
            echo '```'
            cat result/share/layat/coverage/coverage-func.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sara:
    # Knowledge-graph validation of docs/ plus the test-doc-map / glossary-index / risk-matrix /
    # sara-gap / sara-fresh / sara-new / adr-supersede / okf-frontmatter / okf-index / term-avoid / link-text contract tests. Not a
    # required status check. Uses a job-local path filter instead of the `changes` job.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # Full history so `sara-fresh --base` can find the merge base with the PR's base branch.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Scoped to the inputs this job exercises. On workflow_dispatch the step is
      # skipped and `relevant` stays empty, which the guards below treat as "run".
      - name: Detect sara-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v4.0.1
        with:
          filters: |
            relevant:
              - 'docs/**'
              - 'sara.toml'
              - 'dev/flake.nix'
              # Pins sara and the nixpkgs behind the dev wrappers.
              - 'dev/flake.lock'
              - 'dev/tests/**'
              - 'dev/scripts/**'
              - '.github/workflows/test.yml'
              # The test assets the test-doc-map contract test enumerates.
              - '**/*_test.go'
              - 'tests/**'
              # Defines the flake checks the contract test matches against its
              # static list (`checks.hm-module` and friends).
              - 'flake.nix'
              # Prose the term-avoid contract test scans besides docs/.
              - 'README.md'
              - 'README.ja.md'
              - 'CLAUDE.md'
              # Code and config the link-text contract test scans for item IDs.
              - 'internal/**'
              - 'cmd/**'
              - 'lib/**'
              - 'modules/**'
              - 'templates/**'
              - '.github/**'
              - 'dev/skills/**'
              - 'example.*'

      - name: Setup Nix
        if: steps.filter.outputs.relevant != 'false'
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # sara comes from the personal NUR via yasunori0418.cachix.org. The
      # dedicated `sara` devShell avoids building layat.
      - name: Run sara check
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c sara check

      # The test-code ⇔ CASE mapping contract (purely static). `checks.test-doc-map`
      # lives in the dev flake, which the root flake-check does not reach.
      - name: Run test-doc-map contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/test-doc-map.sh

      # The glossary index ⇔ ubiquitous_term item 1:1 contract: every term item
      # is listed exactly once in docs/glossary.md and every link resolves.
      - name: Run glossary-index contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/glossary-index.sh

      # The level derivation contract for risk items: `level` must equal the
      # matrix cell of `likelihood` × `impact`.
      - name: Run risk-matrix contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/risk-matrix.sh

      # The gap enumeration contract for sara-gap, run against a self-contained
      # fixture rather than the live graph.
      - name: Run sara-gap contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/sara-gap.sh

      # The stale-item and high-risk verification enumeration contract for
      # sara-fresh, run against a graph the test builds in a temporary directory.
      - name: Run sara-fresh contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/sara-fresh.sh

      # Lists stale items, missing `generated` updates (pull_request only, against
      # the base branch) and high risks without a human `verified`, to the log and
      # the job summary. Findings (exit 1) pass; only a failed run (exit 2) fails.
      - name: Report stale items with sara-fresh
        if: steps.filter.outputs.relevant != 'false'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          args=()
          if [ -n "$BASE_REF" ]; then
            args=(--base "origin/$BASE_REF")
          fi
          out="$RUNNER_TEMP/sara-fresh.txt"
          status=0
          nix develop '.?dir=dev#sara' -c sara-fresh "${args[@]}" >"$out" || status=$?
          cat "$out"
          if [ "$status" -gt 1 ] || ! grep -q '^## ' "$out"; then
            echo "::error::sara-fresh failed (exit $status)"
            exit 1
          fi
          {
            echo '### sara-fresh'
            echo
            echo '```'
            cat "$out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # The item-creation contract for sara-new, the wrapper around `sara init`
      # that enforces the <slug>.md filename convention.
      - name: Run sara-new contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/sara-new.sh

      # Every ADR pointed to by supersedes is deprecated. Reads frontmatter only.
      - name: Run adr-supersede contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/adr-supersede.sh

      # Shape of the OKF-compatible nested keys (generated / verified / sources)
      # and stale_after in item frontmatter. Reads frontmatter only.
      - name: Run okf-frontmatter contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/okf-frontmatter.sh

      # The committed OKF index.md files under docs/ must match what
      # dev/scripts/okf-index.sh generates from the sara graph.
      - name: Run okf-index contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/okf-index.sh

      # Spellings listed under `avoid` in ubiquitous_term items must not appear in
      # the prose of docs/, README.md, README.ja.md or CLAUDE.md (textlint + prh).
      - name: Run term-avoid contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/term-avoid.sh

      # Link text, frontmatter `name` and H1 must not carry bare tags, and a link
      # must not be followed or wrapped by its own name.
      - name: Run link-text contract test
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop '.?dir=dev#sara' -c dev/tests/link-text.sh

  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.event_name != 'push'
    # Non-NixOS (ubuntu-latest) E2E with real nix. Runs tests/e2e/run.sh inside
    # the ci devShell (layat / git / jq / coreutils).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run E2E harness
        run: nix develop '.?dir=dev#ci' -c tests/e2e/run.sh

  test-doc-matrix:
    # Generates the test-code ⇔ CASE ⇔ TC ⇔ RISK correspondence table and uploads
    # it as an artifact. Runs on main push, workflow_dispatch, and PRs that touch
    # the generator's inputs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # On push / workflow_dispatch this step is skipped and `relevant` stays
      # empty, which the guards below treat as "run". The filter covers the
      # generator's inputs, kept in step with the sara job's filter above.
      - name: Detect generation-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v4.0.1
        with:
          filters: |
            relevant:
              - 'dev/scripts/**'
              - 'dev/tests/test-categories.tsv'
              - 'dev/tests/test-doc-exclusions.tsv'
              - 'dev/flake.nix'
              - 'dev/flake.lock'
              - '.github/workflows/test.yml'
              - 'docs/test/**'
              - 'docs/risks/**'
              - 'docs/model.yaml'
              - 'sara.toml'
              - 'tests/**'
              - 'flake.nix'
              # `--full` runs `go test -json ./...` and evaluates each nix-unit file.
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'lib/**'
              # nix-unit の名前採取は getFlake → inputs.nixpkgs.lib を経由する。
              - 'flake.lock'

      - name: Setup Nix
        if: steps.filter.outputs.relevant != 'false'
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The default dev devShell, not `sara`: generation needs go + jq + yq-go + sara.
      - name: Generate correspondence table
        if: steps.filter.outputs.relevant != 'false'
        run: nix develop ./dev -c dev/scripts/test-doc-matrix.sh test-doc-matrix.md

      # GITHUB_STEP_SUMMARY discards summaries past 1 MiB, so an oversized table
      # falls back to a pointer at the artifact.
      - name: Publish correspondence table to job summary
        if: steps.filter.outputs.relevant != 'false'
        run: |
          if [ "$(stat -c%s test-doc-matrix.md)" -lt 1000000 ]; then
            cat test-doc-matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'test-doc-matrix.md exceeds the 1 MiB step-summary limit; download the `test-doc-matrix` artifact instead.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload correspondence table
        if: steps.filter.outputs.relevant != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-doc-matrix
          path: test-doc-matrix.md
          if-no-files-found: error
