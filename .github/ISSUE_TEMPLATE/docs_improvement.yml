name: ドキュメント改善
description: コンセプト・設計・仕様の README.md / ADR / 用語（ubiquitous-language/）の誤り・不整合・分かりにくさ
labels: ["documentation", "needs-triage"]
body:
  - type: dropdown
    id: target
    attributes:
      label: 対象ドキュメント
      multiple: true
      options:
        - docs/README.md
        - docs/design/README.md
        - docs/requirements/README.md
        - docs/adr/
        - docs/ubiquitous-language/
        - その他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 問題点
      description: どこが誤っている / 不整合 / 分かりにくいか。該当箇所を引用すると早い。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 改善案
      description: どう直すべきか。用語の揺れなら docs/ubiquitous-language/index.md の一覧から用語 item を引き、正名と照らし合わせて。
    validations:
      required: false
