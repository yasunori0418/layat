version: "2"

linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - forbidigo
    - nilerr
    - errname
    - nolintlint
    - wrapcheck
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Is(NotExist|Exist|Permission)$
          msg: use errors.Is with fs.ErrNotExist / fs.ErrExist / fs.ErrPermission
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    wrapcheck:
      ignore-package-globs:
        - github.com/yasunori0418/layat/*
  exclusions:
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
      - path: internal/generation/fake\.go
        linters:
          - wrapcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  relative-path-mode: gomod     # 設定を store へ単独でコピーしても path を go.mod 基準で解決する
